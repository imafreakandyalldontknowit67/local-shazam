<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Local Shazam — your library, recognized locally</title>
  <desc id="banner-description">An original teal waveform becomes connected audio fingerprint landmarks on a dark navy field. Text reads Local Shazam, Find a clip in your own collection, Native Rust, and Experimental Olaf. The illustration represents local-library recognition, not a global music catalog.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111e32"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69e8cf"/>
      <stop offset="1" stop-color="#a1c7ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#263950" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#2b4058"/>
  <path d="M40 28H1160" stroke="#69e8cf" stroke-width="2" opacity="0.65"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="88" fill="#82e4d2" font-size="15" font-weight="600" letter-spacing="3">LOCAL AUDIO RECOGNITION</text>
    <text x="60" y="168" fill="#f3f7fc" font-size="62" font-weight="700" letter-spacing="-2">Local Shazam</text>
    <text x="64" y="216" fill="#c4d3e5" font-size="25">Find a clip in your own collection.</text>

    <rect x="64" y="270" width="144" height="36" rx="18" fill="#14382f" stroke="#2f695c"/>
    <circle cx="83" cy="288" r="4" fill="#80efd2"/>
    <text x="97" y="294" fill="#b6f5e6" font-size="15" font-weight="600">Native Rust</text>
    <rect x="220" y="270" width="183" height="36" rx="18" fill="#172d48" stroke="#3c5676"/>
    <text x="238" y="294" fill="#c6dcfb" font-size="15" font-weight="600">Experimental Olaf</text>
  </g>

  <g aria-hidden="true">
