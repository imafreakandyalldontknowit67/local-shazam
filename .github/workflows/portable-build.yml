name: Private portable build gates

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  native:
    if: github.event.repository.private == true
    name: Native ${{ matrix.target }} (unverified until successful)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.1'
      - name: Mocked packaging and source policy tests (no compiler/audio)
        run: python -B -m unittest discover -s tests/release -v
      - name: Release checkout hygiene
        run: |
          python scripts/check_release_hygiene.py --root .
          python scripts/check_release_hygiene.py --root . --staged
      - name: Locked native build with verified local tool provisioning
        run: python scripts/release.py build --target '${{ matrix.target }}' --out-dir 'build/release/${{ matrix.target }}'
      - name: Explicit non-audio Rust tests, dataset-free Olaf regressions, CLI help/version
        run: python scripts/release.py test --target '${{ matrix.target }}' --out-dir 'build/release/${{ matrix.target }}'
      - name: Matching binary and corresponding source archives
        run: |
          python scripts/release.py package --target '${{ matrix.target }}' --out-dir 'build/release/${{ matrix.target }}'
          python scripts/release.py verify --out-dir 'build/release/${{ matrix.target }}'
      - name: Retain only verified archives and checksums (private repository)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ matrix.target }}
          path: build/release/${{ matrix.target }}/dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
